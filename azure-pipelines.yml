trigger:
  - main

pool:
  vmImage: 'windows-latest'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

- script: |
    dotnet tool install --global dotnet-sonarscanner
    dotnet-sonarscanner begin /k:"hoover328_ComputerParts" /o:"hoover328" /d:sonar.token="$(SONAR_TOKEN)" /d:sonar.host.url="https://sonarcloud.io"
  displayName: 'Begin SonarCloud Analysis'

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '**/*.slnx'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '**/*.slnx'
    arguments: '--configuration Release'

- script: |
    dotnet-sonarscanner end /d:sonar.token="$(SONAR_TOKEN)"
  displayName: 'End SonarCloud Analysis'